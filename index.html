    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        videoId: 'H1suqOUnwyI',
        playerVars: {
          'autoplay': 1,
          'mute': 1,
          'playlist': 'H1suqOUnwyI',
          'loop': 1,
          'controls': 0,
          'playsinline': 1,
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      // Ajusta la velocidad cuando el reproductor esté listo
      // Valores válidos: 0.25, 0.5, 0.75, 1 (normal), 1.25, 1.5, 2
      event.target.setPlaybackRate(0.5); // 0.5 = 50% de la velocidad normal
      event.target.playVideo();
    }
  </script>
</body>
